<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>移動Pad</title>
</head>
<body>
<div id="loading" style="font-family:sans-serif;padding:24px">移動Padを読み込んでいます…</div>
<script>
(async()=>{
  try{
    const names=["chunk_00.txt","chunk_01.txt","chunk_02.txt","chunk_03.txt","chunk_04.txt","chunk_05.txt","chunk_06.txt","chunk_07.txt","chunk_08.txt","chunk_09.txt"];
    const parts=await Promise.all(names.map(async n=>(await (await fetch("./"+n,{cache:"no-store"})).text()).trim()));

    // GitHub連携時に欠けた少数文字を、元データのSHA検証結果に基づき復元。
    parts[1]=parts[1].slice(0,12428)+"AAAAAAAA"+parts[1].slice(12428);
    parts[5]="4"+parts[5];
    parts[5]=parts[5].slice(0,606)+"wej8fj8Xg8Ho/H4/F4PB6Px+PxeD"+parts[5].slice(606);
    parts[6]="A"+parts[6];
    parts[7]="D"+parts[7];
    parts[8]="x"+parts[8];
    parts[9]=parts[9].slice(0,16102)+"b"+parts[9].slice(16102);

    const b64=parts.join("");
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById("loading").textContent="読み込みに失敗しました。ページを再読み込みしてください。";
    console.error(e);
  }
})();
</script>
</body>
</html>
